<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🍜 辦公室點餐</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--g:#06C755;--gd:#05a548;--gl:#e8f9ef;--gb:#b3e6c8;--bg:#f5f5f5;--bg2:#ffffff;--bg3:#f0f0f0;--text:#1a1a1a;--text2:#666;--text3:#999;--border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);--radius:8px;--radius-lg:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;--text:#f0f0f0;--text2:#aaa;--text3:#666;--border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);--gl:#0a2e18;--gb:#0f4a28;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text);min-height:100vh}
.app{max-width:480px;margin:0 auto;background:var(--bg2);min-height:100vh}
.hdr{background:var(--g);color:white;padding:16px;display:flex;align-items:center;gap:12px}
.hdr-ico{width:40px;height:40px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-ico i{color:var(--g);font-size:22px}
.hdr-info{flex:1}
.hdr-title{font-size:17px;font-weight:600}
.hdr-sub{font-size:13px;opacity:.85;margin-top:1px}
.sync-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.7);flex-shrink:0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .3s}
.sync-dot.live{background:#fff}
.back-btn{background:rgba(255,255,255,.2);border:none;color:white;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:18px}
.back-btn:active{background:rgba(255,255,255,.35)}
.screen{display:none}.screen.active{display:block}
.group-list{padding:14px;display:flex;flex-direction:column;gap:10px}
.new-group-btn{width:100%;height:48px;background:var(--g);color:white;border:none;border-radius:var(--radius-lg);font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}
.new-group-btn:active{background:var(--gd)}
.group-card{background:var(--bg3);border-radius:var(--radius-lg);border:0.5px solid var(--border);overflow:hidden;cursor:pointer;transition:border-color .15s}
.group-card:active{border-color:var(--g)}
.gc-body{padding:14px}
.gc-top{display:flex;align-items:flex-start;gap:10px}
.gc-emoji{font-size:28px;flex-shrink:0}
.gc-info{flex:1;min-width:0}
.gc-name{font-size:16px;font-weight:600;color:var(--text)}
.gc-meta{font-size:12px;color:var(--text3);margin-top:3px;display:flex;flex-direction:column;gap:2px}
.gc-meta span{display:flex;align-items:center;gap:4px}
.gc-meta i{font-size:13px}
.gc-status{flex-shrink:0}
.status-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
.status-open{background:#e8f9ef;color:#085041}
.status-closed{background:#fde8e8;color:#791f1f}
.status-upcoming{background:#fff3e0;color:#7a4500}
.gc-footer{padding:10px 14px;border-top:0.5px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg2)}
.gc-stat{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}
.gc-stat i{font-size:14px;color:var(--text3)}
.gc-del{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:4px}
.gc-del:active{color:#e24b4a}
.empty-groups{text-align:center;padding:48px 16px;color:var(--text3)}
.empty-groups i{font-size:40px;display:block;margin-bottom:12px;opacity:.3}
.empty-groups p{font-size:14px;margin-bottom:4px}
.empty-groups small{font-size:12px;opacity:.7}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px;width:100%;max-width:480px;transform:translateY(20px);transition:transform .2s}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-title i{color:var(--g);font-size:20px}
.form-row{margin-bottom:12px}
.form-label{font-size:12px;color:var(--text3);margin-bottom:5px;display:block;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.form-input{width:100%;height:40px;font-size:14px;padding:0 12px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);-webkit-appearance:none}
.form-input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 2px rgba(6,199,85,.15)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
.emoji-opt{width:100%;aspect-ratio:1;font-size:22px;background:var(--bg3);border:2px solid transparent;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center}
.emoji-opt.selected{border-color:var(--g);background:var(--gl)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.btn-cancel{flex:1;height:44px;background:var(--bg3);color:var(--text2);border:none;border-radius:var(--radius-lg);font-size:14px;cursor:pointer}
.btn-confirm{flex:2;height:44px;background:var(--g);color:white;border:none;border-radius:var(--radius-lg);font-size:15px;font-weight:500;cursor:pointer}
.btn-confirm:active{background:var(--gd)}
.order-hdr-sub{font-size:12px;opacity:.8;margin-top:2px;display:flex;align-items:center;gap:6px}
.order-hdr-sub i{font-size:13px}
.tabs{display:flex;border-bottom:0.5px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:10}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s;user-select:none}
.tab.active{color:var(--g);border-bottom-color:var(--g);font-weight:500}
.tab i{font-size:15px;vertical-align:-2px;margin-right:2px}
.panel{display:none;padding:14px}.panel.active{display:block}
.lbl{font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.hint{font-size:12px;color:var(--text3);margin-bottom:8px}
.field-group{display:flex;gap:8px;margin-bottom:8px}
.field-group input{height:40px;font-size:14px;padding:0 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);-webkit-appearance:none}
.field-group input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 2px rgba(6,199,85,.15)}
#iName{flex:3;min-width:0}#iPrice{flex:2;min-width:0}#iQty{width:56px;flex-shrink:0}
.half-note-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.half-check{display:flex;align-items:center;gap:6px;padding:0 12px;height:36px;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius);cursor:pointer;user-select:none;white-space:nowrap;flex-shrink:0;transition:all .15s}
.half-check input[type=checkbox]{width:15px;height:15px;accent-color:var(--g);cursor:pointer}
.half-check span{font-size:13px;color:var(--text2)}
.half-check.on{background:var(--gl);border-color:var(--g)}
.half-check.on span{color:var(--gd);font-weight:500}
.note-input{flex:1;height:36px;font-size:13px;padding:0 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--text)}
.note-input:focus{outline:none;border-color:var(--g);background:var(--bg2)}
.add-btn{height:40px;padding:0 16px;background:var(--g);color:white;border:none;border-radius:var(--radius);font-size:15px;cursor:pointer;flex-shrink:0}
.add-btn:active{background:var(--gd)}
.name-row{display:flex;gap:8px;margin-bottom:14px}
.name-row input{flex:1;height:40px;font-size:14px;padding:0 12px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text)}
.name-row input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 2px rgba(6,199,85,.15)}
.cart-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.cart-item{padding:10px 12px;background:var(--bg3);border-radius:var(--radius);border:0.5px solid var(--border)}
.ci-top{display:flex;align-items:center;gap:8px}
.ci-name{flex:1;font-size:14px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-price{font-size:12px;color:var(--text3);white-space:nowrap}
.qty-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qb{width:26px;height:26px;border-radius:50%;border:0.5px solid var(--border2);background:var(--bg2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.qb:active{background:var(--gl)}
.qn{font-size:15px;font-weight:500;min-width:20px;text-align:center;color:var(--text)}
.ci-sub{font-size:13px;font-weight:500;color:var(--text);min-width:56px;text-align:right;white-space:nowrap}
.ci-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:4px;flex-shrink:0}
.ci-tags{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.tag-half{font-size:11px;padding:2px 8px;background:var(--gl);color:var(--gd);border-radius:20px;border:0.5px solid var(--gb);font-weight:500}
.tag-note{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:3px}
.tag-note i{font-size:12px}
.summary{padding:12px 14px;background:var(--gl);border-radius:var(--radius);border:0.5px solid var(--gb);margin-bottom:12px}
.sum-total{display:flex;justify-content:space-between;font-size:16px;font-weight:500;color:var(--gd)}
.submit-btn{width:100%;height:48px;background:var(--g);color:white;border:none;border-radius:var(--radius-lg);font-size:16px;font-weight:500;cursor:pointer}
.submit-btn:active{background:var(--gd)}
.submit-btn:disabled{background:var(--border2);cursor:default;color:var(--text3)}
.closed-notice{background:#fde8e8;border:0.5px solid #f7c1c1;border-radius:var(--radius);padding:14px;text-align:center;font-size:13px;color:#791f1f;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:center}
.closed-notice i{font-size:18px}
.empty{text-align:center;padding:40px 16px;color:var(--text3);font-size:14px}
.empty i{font-size:36px;margin-bottom:10px;display:block;opacity:.3}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
.loading-state{text-align:center;padding:40px 16px;color:var(--text3);font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.order-card{background:var(--bg3);border-radius:var(--radius-lg);border:0.5px solid var(--border);margin-bottom:10px;overflow:hidden}
.oc-hdr{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:0.5px solid var(--border)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:white;flex-shrink:0}
.oc-name{flex:1;font-size:14px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-total{font-size:13px;font-weight:500;color:var(--gd);white-space:nowrap}
.pay-badge{font-size:12px;padding:4px 10px;border-radius:20px;cursor:pointer;border:none;font-weight:500;flex-shrink:0;transition:all .15s}
.pay-badge.paid{background:#dcf5e7;color:#085041}
.pay-badge.unpaid{background:#fde8e8;color:#791f1f}
.oc-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:4px;flex-shrink:0}
.oc-items{padding:10px 14px}
.oi-row{font-size:13px;color:var(--text2);padding:3px 0}
.oi-main{display:flex;justify-content:space-between}
.oi-tags{margin-top:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.clear-btn{font-size:12px;color:var(--text3);background:none;border:0.5px solid var(--border2);border-radius:var(--radius);padding:5px 12px;cursor:pointer}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--bg3);border-radius:var(--radius);padding:14px 12px;text-align:center}
.stat-n{font-size:22px;font-weight:600;color:var(--text)}
.stat-l{font-size:12px;color:var(--text3);margin-top:3px}
.pay-summary{display:flex;gap:10px;margin-bottom:14px}
.pay-box{flex:1;padding:12px;border-radius:var(--radius);text-align:center;border:0.5px solid}
.pay-box.paid-box{background:#e8f9ef;border-color:var(--gb)}
.pay-box.unpaid-box{background:#fde8e8;border-color:#f7c1c1}
.pay-box .pn{font-size:18px;font-weight:600}
.pay-box.paid-box .pn{color:#085041}.pay-box.unpaid-box .pn{color:#791f1f}
.pay-box .pl{font-size:12px;margin-top:3px}
.pay-box.paid-box .pl{color:#0f6e56}.pay-box.unpaid-box .pl{color:#a32d2d}
.isum-row{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg3);border-radius:var(--radius);margin-bottom:6px;border:0.5px solid var(--border)}
.isum-name{flex:1;font-size:13px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isum-price{font-size:12px;color:var(--text3);white-space:nowrap}
.isum-qty{font-size:13px;color:var(--text2);white-space:nowrap}
.isum-amt{font-size:13px;font-weight:500;color:var(--gd);min-width:64px;text-align:right;white-space:nowrap}
.copy-btn{width:100%;height:44px;background:var(--bg3);color:var(--text);border:0.5px solid var(--border2);border-radius:var(--radius-lg);font-size:14px;cursor:pointer;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.copy-btn:active{background:var(--gl)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:white;padding:10px 20px;border-radius:24px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.upload-zone{width:100%;min-height:80px;border:1.5px dashed var(--border2);border-radius:var(--radius);background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.upload-zone:hover,.upload-zone.drag{border-color:var(--g);background:var(--gl)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-zone i{font-size:24px;color:var(--text3)}
.upload-zone span{font-size:13px;color:var(--text3)}
.upload-zone.has-img{padding:0;min-height:120px}
.upload-zone.has-img img{width:100%;height:120px;object-fit:cover;display:block}
.upload-preview-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg3);border-top:0.5px solid var(--border)}
.upload-preview-bar span{font-size:12px;color:var(--text3)}
.upload-preview-bar button{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:2px 6px}
.upload-preview-bar button:hover{color:#e24b4a}
.menu-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--gl);border:0.5px solid var(--gb);border-radius:var(--radius);font-size:13px;color:var(--gd);font-weight:500;cursor:pointer;width:100%;margin-bottom:12px;transition:background .15s}
.menu-btn:active{background:var(--gb)}
.menu-btn i{font-size:16px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.lightbox.show{opacity:1;pointer-events:all}
.lightbox img{max-width:96vw;max-height:80vh;border-radius:var(--radius);object-fit:contain}
.lightbox-close{position:absolute;top:16px;right:16px;width:40px;height:40px;background:rgba(255,255,255,.15);border:none;border-radius:50%;color:white;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lightbox-close:active{background:rgba(255,255,255,.25)}
.lightbox-caption{color:rgba(255,255,255,.6);font-size:13px;margin-top:12px}
.upload-progress{height:3px;background:var(--gl);border-radius:2px;margin-top:6px;overflow:hidden;display:none}
.upload-progress.show{display:block}
.upload-progress-bar{height:100%;background:var(--g);border-radius:2px;width:0;transition:width .3s}
</style>
</head>
<body>
<div class="app">

  <!-- Screen: Group List -->
  <div id="screen-groups" class="screen active">
    <div class="hdr">
      <div class="hdr-ico"><i class="ti ti-shopping-cart"></i></div>
      <div class="hdr-info"><div class="hdr-title">🍜 辦公室點餐</div><div class="hdr-sub">選擇或新增揪團</div></div>
      <div class="sync-wrap"><div class="sync-dot" id="syncDot"></div><span id="syncLabel">連線中</span></div>
    </div>
    <div class="group-list">
      <button class="new-group-btn" id="btnNewGroup"><i class="ti ti-plus"></i> 新增揪團</button>
      <div id="groupList"><div class="loading-state"><div class="spinner"></div><br>載入中…</div></div>
    </div>
  </div>

  <!-- Screen: Order -->
  <div id="screen-order" class="screen">
    <div class="hdr">
      <button class="back-btn" id="btnBack"><i class="ti ti-arrow-left"></i></button>
      <div class="hdr-info">
        <div class="hdr-title" id="orderHdrTitle">揪團點餐</div>
        <div class="order-hdr-sub" id="orderHdrSub"></div>
      </div>
      <div class="sync-wrap"><div class="sync-dot live"></div><span>即時同步</span></div>
    </div>
    <div class="tabs">
      <div class="tab active" id="tab-btn-order"><i class="ti ti-pencil"></i>我要點餐</div>
      <div class="tab" id="tab-btn-list"><i class="ti ti-list"></i>所有訂單</div>
      <div class="tab" id="tab-btn-stats"><i class="ti ti-chart-bar"></i>統計彙整</div>
    </div>
    <div id="tab-order" class="panel active">
      <div id="menuBtnWrap" style="display:none">
        <button class="menu-btn" id="menuBtn"><i class="ti ti-photo"></i> 查看菜單</button>
      </div>
      <div id="closedNotice" class="closed-notice" style="display:none"><i class="ti ti-lock"></i> 此揪團已截止收單，無法點餐</div>
      <div class="lbl">你的名字</div>
      <div class="name-row"><input id="uName" type="text" placeholder="輸入你的名字" maxlength="12"></div>
      <div class="lbl">新增餐點</div>
      <p class="hint">填入名稱、單價、數量，可勾選半飯，按 + 加入</p>
      <div class="field-group">
        <input id="iName" type="text" placeholder="餐點名稱" maxlength="20">
        <input id="iPrice" type="number" placeholder="單價" min="0" step="1">
        <input id="iQty" type="number" placeholder="數" min="1" value="1" step="1">
        <button class="add-btn" id="btnAddItem"><i class="ti ti-plus"></i></button>
      </div>
      <div class="half-note-row">
        <label class="half-check" id="halfLabel">
          <input type="checkbox" id="iHalf">
          <span>🍚 半飯</span>
        </label>
        <input class="note-input" id="iNote" type="text" placeholder="備註（可選）：不加辣、少冰…" maxlength="40">
      </div>
      <div id="cartList" class="cart-list"></div>
      <div id="cartSummary" style="display:none" class="summary">
        <div class="sum-total"><span>小計</span><span id="cartTotal">NT$ 0</span></div>
      </div>
      <button class="submit-btn" id="submitBtn" disabled>送出訂單</button>
    </div>
    <div id="tab-list" class="panel">
      <div class="sec-hdr">
        <span style="font-size:15px;font-weight:500">所有訂單</span>
        <button class="clear-btn" id="btnClearAll"><i class="ti ti-trash" style="font-size:13px;vertical-align:-1px"></i> 清空全部</button>
      </div>
      <div id="orderList"><div class="loading-state"><div class="spinner"></div><br>載入中…</div></div>
    </div>
    <div id="tab-stats" class="panel">

// ── Helpers ──────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let _tt;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 2600);
}

function flash(id){
  const el = document.getElementById(id);
  el.style.borderColor = '#e24b4a'; el.focus();
  setTimeout(() => el.style.borderColor = '', 1200);
}

function setSync(ok){
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  if(ok){ dot.classList.add('live'); lbl.textContent = '已連線'; }
  else { dot.classList.remove('live'); lbl.textContent = '連線失敗'; }
}

function getGroupStatus(g){
  if(!g.date || !g.time) return 'open';
  const deadline = new Date(g.date + 'T' + g.time);
  const now = new Date();
  const openFrom = new Date(g.date + 'T00:00:00');
  if(now < openFrom) return 'upcoming';
  if(now > deadline) return 'closed';
  return 'open';
}

function formatDeadline(g){
  if(!g.date) return '';
  const d = new Date(g.date);
  const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
  return g.time ? `${dateStr} 收單 ${g.time}` : dateStr;
}

// ── Group List ────────────────────────────────────────
function renderGroups(){
  const el = document.getElementById('groupList');
  const list = Object.entries(groups);
  if(!list.length){
    el.innerHTML = `<div class="empty-groups"><i class="ti ti-mood-empty"></i><p>還沒有揪團</p><small>按上方「新增揪團」開始吧！</small></div>`;
    return;
  }
  list.sort((a,b) => b[1].createdAt - a[1].createdAt);
  el.innerHTML = list.map(([id,g]) => {
    const status = getGroupStatus(g);
    const statusMap = {open:'收單中',closed:'已截止',upcoming:'尚未開始'};
    const statusClass = {open:'status-open',closed:'status-closed',upcoming:'status-upcoming'};
    const orderCount = g.orders ? Object.keys(g.orders).length : 0;
    const totalAmt = g.orders ? Object.values(g.orders).reduce((s,o) => s+o.total, 0) : 0;
    return `<div class="group-card" data-gid="${id}">
      <div class="gc-body">
        <div class="gc-top">
          <span class="gc-emoji">${g.emoji||'🍱'}</span>
          <div class="gc-info">
            <div class="gc-name">${esc(g.name)}</div>
            <div class="gc-meta">
              ${g.date ? `<span><i class="ti ti-calendar"></i>${formatDeadline(g)}</span>` : '<span><i class="ti ti-infinity"></i>無截止時間</span>'}
            </div>
          </div>
          <div class="gc-status"><span class="status-badge ${statusClass[status]}">${statusMap[status]}</span></div>
        </div>
      </div>
      <div class="gc-footer">
        <span class="gc-stat"><i class="ti ti-users"></i>${orderCount} 人點餐</span>
        <span class="gc-stat" style="margin-left:12px"><i class="ti ti-cash"></i>NT$ ${totalAmt}</span>
        <button class="gc-del" data-del="${id}"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.group-card').forEach(card => {
    card.addEventListener('click', () => enterGroup(card.dataset.gid));
  });
  document.querySelectorAll('.gc-del').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); deleteGroup(btn.dataset.del); });
  });
}

async function deleteGroup(id){
  if(!confirm('確定刪除這個揪團及所有訂單？')) return;
  await remove(ref(db, 'groups/' + id));
  showToast('揪團已刪除');
}

function enterGroup(id){
  currentGroupId = id;
  const g = groups[id];
  document.getElementById('screen-groups').classList.remove('active');
  document.getElementById('screen-order').classList.add('active');
  document.getElementById('orderHdrTitle').textContent = (g.emoji||'🍱') + ' ' + g.name;
  const sub = document.getElementById('orderHdrSub');
  sub.innerHTML = g.date ? `<i class="ti ti-clock"></i> 收單：${formatDeadline(g)}` : '';
  // Show/hide menu button
  const menuWrap = document.getElementById('menuBtnWrap');
  const menuBtn = document.getElementById('menuBtn');
  if(g.menuUrl){
    menuWrap.style.display = 'block';
    menuBtn.onclick = () => openLightbox(g.menuUrl, (g.emoji||'🍱') + ' ' + g.name + ' 菜單');
  } else {
    menuWrap.style.display = 'none';
  }
  switchTab('order');
  checkClosed();
  if(ordersUnsubscribe) ordersUnsubscribe();
  ordersUnsubscribe = onValue(ref(db, 'groups/' + id + '/orders'), snap => {
    orders = snap.val() || {};
    if(currentTab === 'list') renderOrders();
    if(currentTab === 'stats') renderStats();
  });
}

function checkClosed(){
  const g = groups[currentGroupId];
  if(!g) return;
  const closed = getGroupStatus(g) === 'closed';
  document.getElementById('closedNotice').style.display = closed ? 'flex' : 'none';
  document.getElementById('submitBtn').disabled = closed || !cart.length;
  ['iName','iPrice','iQty','iHalf','iNote','btnAddItem'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.disabled = closed;
  });
}

function buildEmojiGrid(){
  document.getElementById('emojiGrid').innerHTML = EMOJIS.map(e =>
    `<button class="emoji-opt${e===selectedEmoji?' selected':''}" data-emoji="${e}">${e}</button>`

function closeModal(){

async function createGroup(){
  const name = document.getElementById('gName').value.trim();
  if(!name){ flash('gName'); return; }
  const date = document.getElementById('gDate').value;
  const time = document.getElementById('gTime').value;
  const newRef = push(ref(db, 'groups'));
  const groupId = newRef.key;
  const confirmBtn = document.getElementById('btnConfirmModal');
  confirmBtn.disabled = true; confirmBtn.textContent = '建立中…';
  try {
    let menuUrl = null;
    if(menuImgFile){
      menuUrl = await compressAndEncodeImage(menuImgFile);
    }
    await set(newRef, { name, emoji: selectedEmoji, date, time, createdAt: Date.now(), ...(menuUrl ? {menuUrl} : {}) });
    closeModal();
    showToast('✅ 揪團「' + name + '」已建立！');
  } catch(e){ showToast('❌ 建立失敗，請重試'); }
  confirmBtn.disabled = false; confirmBtn.textContent = '建立揪團';
}

async function compressAndEncodeImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX = 1000;
      let w = img.width, h = img.height;
      if(w > MAX || h > MAX){
        if(w > h){ h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = reject;
    img.src = url;
  });
}

// ── Order Panel ───────────────────────────────────────
function switchTab(t){
  currentTab = t;
  ['order','list','stats'].forEach(n => {
    document.getElementById('tab-btn-' + n).classList.toggle('active', n === t);
    document.getElementById('tab-' + n).classList.toggle('active', n === t);
  });
  if(t === 'list') renderOrders();
  if(t === 'stats') renderStats();
}

function addItem(){
  const g = groups[currentGroupId];
  if(g && getGroupStatus(g) === 'closed'){ showToast('此揪團已截止收單'); return; }
  const name = document.getElementById('iName').value.trim();
  const price = parseInt(document.getElementById('iPrice').value) || 0;
  const qty = Math.max(1, parseInt(document.getElementById('iQty').value) || 1);
  const half = document.getElementById('iHalf').checked;
  const note = document.getElementById('iNote').value.trim();
  if(!name){ flash('iName'); return; }
  if(!price){ flash('iPrice'); return; }
  const exist = cart.findIndex(c => c.name===name && c.price===price && c.half===half && c.note===note);
  if(exist >= 0){ cart[exist].qty += qty; }
  else { cart.push({ name, price, qty, half, note }); }
  document.getElementById('iName').value = '';
  document.getElementById('iPrice').value = '';
  document.getElementById('iQty').value = '1';
  document.getElementById('iHalf').checked = false;
  document.getElementById('halfLabel').classList.remove('on');
  document.getElementById('iNote').value = '';
  document.getElementById('iName').focus();
  renderCart();
}

function renderCart(){
  const el = document.getElementById('cartList');
  if(!cart.length){
    el.innerHTML = '';
    document.getElementById('cartSummary').style.display = 'none';
    const g = groups[currentGroupId];
    const closed = g && getGroupStatus(g) === 'closed';
    document.getElementById('submitBtn').disabled = true || closed;
    return;
  }
  el.innerHTML = cart.map((c,i) => `
    <div class="cart-item">
      <div class="ci-top">
        <span class="ci-name">${esc(c.name)}</span>
        <span class="ci-price">NT$${c.price}</span>
        <div class="qty-ctrl">
          <button class="qb" data-ci="${i}" data-d="-1">−</button>
          <span class="qn">${c.qty}</span>
          <button class="qb" data-ci="${i}" data-d="1">+</button>
        </div>
        <span class="ci-sub">NT$ ${c.price*c.qty}</span>
        <button class="ci-del" data-ci="${i}"><i class="ti ti-x"></i></button>
      </div>
      ${(c.half || c.note) ? `<div class="ci-tags">
        ${c.half ? '<span class="tag-half">🍚 半飯</span>' : ''}
        ${c.note ? `<span class="tag-note"><i class="ti ti-message-circle"></i>${esc(c.note)}</span>` : ''}
      </div>` : ''}
    </div>`).join('');
  document.querySelectorAll('.qb[data-ci]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.ci, d = +btn.dataset.d;
      cart[i].qty = Math.max(1, cart[i].qty + d);
      renderCart();
    });
  });
  document.querySelectorAll('.ci-del[data-ci]').forEach(btn => {
    btn.addEventListener('click', () => { cart.splice(+btn.dataset.ci, 1); renderCart(); });
  });
  const total = cart.reduce((s,c) => s+c.price*c.qty, 0);
  document.getElementById('cartTotal').textContent = 'NT$ ' + total;
  document.getElementById('cartSummary').style.display = 'block';
  document.getElementById('submitBtn').disabled = false;
}

async function submitOrder(){
  const g = groups[currentGroupId];
  if(g && getGroupStatus(g) === 'closed'){ showToast('此揪團已截止收單'); return; }
  const name = document.getElementById('uName').value.trim();
  if(!name){ flash('uName'); showToast('請先輸入名字！'); return; }
  if(!cart.length){ showToast('請先加入餐點！'); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '送出中…';
  try{
    const items = cart.map(c => ({...c}));
    const total = items.reduce((s,c) => s+c.price*c.qty, 0);
    const key = name.replace(/[.#$[\]/]/g, '_');
    const existingPaid = orders[key] ? orders[key].paid : false;
    await set(ref(db, 'groups/' + currentGroupId + '/orders/' + key), {name, items, total, paid: existingPaid, time: Date.now()});
    cart = []; renderCart();
    showToast('✅ ' + name + ' 的訂單已送出！');
  } catch(e){ showToast('❌ 送出失敗，請重試'); }
  btn.disabled = false; btn.textContent = '送出訂單';
}

async function togglePaid(key){
  await update(ref(db, 'groups/' + currentGroupId + '/orders/' + key), {paid: !orders[key].paid});
}

async function deleteOrder(key){
  await remove(ref(db, 'groups/' + currentGroupId + '/orders/' + key));
}

async function clearAll(){
  if(!Object.keys(orders).length) return;
  if(!confirm('確定要清空所有訂單？')) return;
  await remove(ref(db, 'groups/' + currentGroupId + '/orders'));
  showToast('已清空所有訂單');
}

function renderOrders(){
  const el = document.getElementById('orderList');
  const list = Object.entries(orders);
  if(!list.length){ el.innerHTML = '<div class="empty"><i class="ti ti-clipboard"></i>還沒有人點餐</div>'; return; }
  el.innerHTML = list.sort((a,b) => a[1].time - b[1].time).map(([key,o]) => {
    const rows = o.items.map(i => `
      <div class="oi-row">
        <div class="oi-main"><span>${esc(i.name)} × ${i.qty}</span><span>NT$ ${i.price*i.qty}</span></div>
        ${(i.half || i.note) ? `<div class="oi-tags">
          ${i.half ? '<span class="tag-half">🍚 半飯</span>' : ''}
          ${i.note ? `<span class="tag-note"><i class="ti ti-message-circle"></i>${esc(i.note)}</span>` : ''}
        </div>` : ''}
      </div>`).join('');
    return `<div class="order-card">
      <div class="oc-hdr">
        <div class="avatar">${esc(o.name.slice(0,1))}</div>
        <span class="oc-name">${esc(o.name)}</span>
        <span class="oc-total">NT$ ${o.total}</span>

        <button class="oc-del" data-dk="${key}"><i class="ti ti-trash"></i></button>
      </div>
      <div class="oc-items">${rows}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.pay-badge[data-pk]').forEach(btn => {
    btn.addEventListener('click', () => togglePaid(btn.dataset.pk));
  });
  document.querySelectorAll('.oc-del[data-dk]').forEach(btn => {
    btn.addEventListener('click', () => deleteOrder(btn.dataset.dk));
  });
}

// ── Build item map: split normal vs half-rice ─────────
function buildItemMap(orderList) {
  const imap = {};
  orderList.forEach(o => o.items.forEach(i => {
    // Key includes half-rice flag so they're counted separately
    const k = i.name + '|' + i.price + '|' + (i.half ? '1' : '0');
    if(!imap[k]) imap[k] = { name: i.name, price: i.price, half: !!i.half, qty: 0, amt: 0 };
    imap[k].qty += i.qty;
    imap[k].amt += i.price * i.qty;
  }));
  return imap;
}

function renderStats(){
  const el = document.getElementById('statsContent');
  const list = Object.values(orders);
  if(!list.length){ el.innerHTML = '<div class="empty"><i class="ti ti-chart-bar"></i>還沒有訂單資料</div>'; return; }
  const totalAmt = list.reduce((s,o) => s+o.total, 0);
  const paidAmt = list.filter(o=>o.paid).reduce((s,o) => s+o.total, 0);
  const paidCount = list.filter(o=>o.paid).length;

  const imap = buildItemMap(list);
  const sorted = Object.values(imap).sort((a,b) => b.qty - a.qty);
  const totalItems = sorted.reduce((s,i) => s+i.qty, 0);

  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat"><div class="stat-n">${list.length}</div><div class="stat-l">點餐人數</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--gd)">NT$ ${totalAmt}</div><div class="stat-l">總金額</div></div>
      <div class="stat"><div class="stat-n">${totalItems}</div><div class="stat-l">總份數</div></div>
      <div class="stat"><div class="stat-n">NT$ ${Math.round(totalAmt/list.length)}</div><div class="stat-l">平均消費</div></div>
    </div>
    <div class="lbl" style="margin-bottom:8px">付款狀況</div>
    <div class="pay-summary">
      <div class="pay-box paid-box"><div class="pn">NT$ ${paidAmt}</div><div class="pl">已付 ${paidCount} 人</div></div>
      <div class="pay-box unpaid-box"><div class="pn">NT$ ${totalAmt-paidAmt}</div><div class="pl">未付 ${list.length-paidCount} 人</div></div>
    </div>
    <div class="lbl" style="margin-bottom:8px">各品項統計</div>
    ${sorted.map(i => `
      <div class="isum-row">
        <span class="isum-name">${esc(i.name)}${i.half ? ' <span class="tag-half">🍚 半飯</span>' : ''}</span>
        <span class="isum-price">NT$${i.price}/份</span>
        <span class="isum-qty">${i.qty} 份</span>
        <span class="isum-amt">NT$ ${i.amt}</span>
      </div>`).join('')}
    <button class="copy-btn" id="btnCopyResult"><i class="ti ti-copy"></i> 複製統計結果，貼到 LINE 群組</button>
  `;
  document.getElementById('btnCopyResult').addEventListener('click', copyResult);
}

function copyResult(){
  const g = groups[currentGroupId];
  const list = Object.values(orders);
  const totalAmt = list.reduce((s,o) => s+o.total, 0);

  const imap = buildItemMap(list);

  let txt = `${g.emoji||'🍱'} ${g.name} 點餐統計\n`;
  if(g.date) txt += `📅 ${formatDeadline(g)}\n`;
  txt += '──────────────\n';
  list.forEach(o => {
    txt += `${o.paid?'✓':'○'} ${o.name}：NT$ ${o.total}`;
    const tags = o.items.filter(i => i.half||i.note).map(i => {
      const parts = [i.half?'半飯':'', i.note].filter(Boolean).join('，');
      return `${i.name}(${parts})`;
    });
    if(tags.length) txt += ' ［' + tags.join('、') + '］';
    txt += '\n';
  });
  txt += '──────────────\n';
  Object.values(imap).sort((a,b) => b.qty-a.qty).forEach(i => {
    const label = i.half ? `${i.name}（半飯）` : i.name;
    txt += `${label} × ${i.qty}份  NT$ ${i.amt}\n`;
  });
  const paid = list.filter(o=>o.paid).reduce((s,o) => s+o.total, 0);
  txt += `──────────────\n💰 總計：NT$ ${totalAmt}（共 ${list.length} 人）\n✓ 已付：NT$ ${paid}　○ 未付：NT$ ${totalAmt-paid}`;
  navigator.clipboard.writeText(txt).then(() => showToast('📋 已複製！可貼到 LINE 群組'));
}

let menuImgFile = null;

function bindUploadZone(){
  const input = document.getElementById('gMenuImg');
  const zone = document.getElementById('uploadZone');
  if(!input || !zone) return;
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if(file) setMenuPreview(file);
  });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag');
    const file = e.dataTransfer.files[0];
    if(file && file.type.startsWith('image/')) setMenuPreview(file);
  });
}

function setMenuPreview(file){
  menuImgFile = file;
  const zone = document.getElementById('uploadZone');
  const reader = new FileReader();
  reader.onload = ev => {
    zone.classList.add('has-img');
    zone.innerHTML = `
      <img src="${ev.target.result}" alt="菜單預覽">
      <div class="upload-preview-bar">
        <span>${file.name}</span>
        <button id="btnRemoveImg" title="移除"><i class="ti ti-x"></i></button>
      </div>`;
    document.getElementById('btnRemoveImg').addEventListener('click', e => {
      e.stopPropagation();
      menuImgFile = null;
      zone.classList.remove('has-img');
      zone.innerHTML = '<input type="file" id="gMenuImg" accept="image/*"><i class="ti ti-photo-up"></i><span>點擊或拖曳上傳菜單圖片</span>';
      bindUploadZone();
    });
  };
  reader.readAsDataURL(file);
}

// ── Lightbox ──────────────────────────────────────────
function openLightbox(url, caption){
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightboxCaption').textContent = caption || '';
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}

// ── Event Bindings ────────────────────────────────────
document.getElementById('btnNewGroup').addEventListener('click', openModal);
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', e => { if(e.target === document.getElementById('lightbox')) closeLightbox(); });
bindUploadZone();
document.getElementById('btnBack').addEventListener('click', () => {
  document.getElementById('screen-order').classList.remove('active');
  document.getElementById('screen-groups').classList.add('active');
  if(ordersUnsubscribe){ ordersUnsubscribe(); ordersUnsubscribe = null; }
  currentGroupId = null; orders = {}; cart = []; renderCart();
});
document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target === document.getElementById('modalOverlay')) closeModal(); });
document.getElementById('btnCancelModal').addEventListener('click', closeModal);
document.getElementById('btnConfirmModal').addEventListener('click', createGroup);
document.getElementById('btnAddItem').addEventListener('click', addItem);
document.getElementById('submitBtn').addEventListener('click', submitOrder);
document.getElementById('btnClearAll').addEventListener('click', clearAll);

document.getElementById('tab-btn-order').addEventListener('click', () => switchTab('order'));
document.getElementById('tab-btn-list').addEventListener('click', () => switchTab('list'));
document.getElementById('tab-btn-stats').addEventListener('click', () => switchTab('stats'));

document.getElementById('iHalf').addEventListener('change', function(){
  document.getElementById('halfLabel').classList.toggle('on', this.checked);
});

document.getElementById('iName').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('iPrice').focus(); });
document.getElementById('iPrice').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('iQty').focus(); });
document.getElementById('iQty').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('iNote').focus(); });
document.getElementById('iNote').addEventListener('keydown', e => { if(e.key==='Enter') addItem(); });

// ── Firebase ──────────────────────────────────────────
onValue(ref(db, 'groups'), snap => {
  groups = snap.val() || {};
  setSync(true);
  renderGroups();
  if(currentGroupId) checkClosed();
}, () => setSync(false));
</script>
</body>
</html>
